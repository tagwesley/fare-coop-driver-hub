<style>
  :root {
    --navy: #17243a;
    --navy-2: #223552;
    --ink: #1d2838;
    --muted: #667085;
    --paper: #f4f6f8;
    --white: #ffffff;
    --line: #dde3ea;
    --green: #25a36f;
    --green-dark: #147a50;
    --green-soft: #e8f6f0;
    --amber: #d98b1f;
    --amber-soft: #fff4df;
    --red: #b83b4b;
    --red-soft: #fdecef;
    --shadow: 0 14px 40px rgba(23, 36, 58, .10);
    --radius: 20px;
  }

  * { box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    margin: 0;
    color: var(--ink);
    background:
      radial-gradient(circle at 10% -10%, rgba(37, 163, 111, .14), transparent 32rem),
      var(--paper);
    font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button, input, select, textarea { font: inherit; }
  button { -webkit-tap-highlight-color: transparent; }
  .hidden { display: none !important; }
  .app-shell { min-height: 100vh; }

  .auth-screen {
    width: min(100%, 520px);
    min-height: 100vh;
    margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 22px 34px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 22px;
  }
  .brand-block { text-align: center; }
  .brand-logo { width: 108px; height: 108px; object-fit: contain; margin-bottom: 12px; }
  .eyebrow { margin: 0 0 7px; color: var(--green-dark); font-size: 12px; line-height: 1.2; font-weight: 800; letter-spacing: .16em; }
  h1, h2, h3, p { overflow-wrap: anywhere; }
  h1 { margin: 0; font-size: clamp(34px, 10vw, 52px); line-height: .98; letter-spacing: -.045em; color: var(--navy); }
  h2 { margin: 0; font-size: 28px; letter-spacing: -.025em; color: var(--navy); }
  h3 { margin: 0; color: var(--navy); font-size: 18px; }
  .lead { max-width: 420px; margin: 16px auto 0; color: var(--muted); line-height: 1.55; }
  .auth-card, .card {
    background: rgba(255,255,255,.94);
    border: 1px solid rgba(221,227,234,.9);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
  }
  .auth-card { padding: 22px; display: grid; gap: 13px; }
  label { color: var(--navy); font-size: 13px; font-weight: 800; }
  input, select, textarea {
    width: 100%;
    border: 1px solid #cfd7e2;
    border-radius: 13px;
    color: var(--ink);
    background: var(--white);
    padding: 14px 15px;
    outline: none;
    transition: box-shadow .18s ease, border-color .18s ease;
  }
  input:focus, select:focus, textarea:focus { border-color: var(--green); box-shadow: 0 0 0 4px rgba(37,163,111,.12); }
  textarea { resize: vertical; min-height: 120px; }
  .code-input { text-align: center; font-size: 28px; font-weight: 800; letter-spacing: .32em; padding-left: calc(15px + .32em); }
  .form-help, .privacy-note { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
  .privacy-note { text-align: center; }
  .text-button { border: 0; padding: 0; color: var(--green-dark); background: transparent; font-size: 13px; font-weight: 750; text-align: left; cursor: pointer; }

  .button {
    min-height: 48px;
    border: 0;
    border-radius: 13px;
    padding: 12px 16px;
    font-weight: 800;
    cursor: pointer;
    transition: transform .12s ease, opacity .12s ease, background .12s ease;
  }
  .button:active { transform: scale(.985); }
  .button:disabled { cursor: wait; opacity: .55; }
  .button-primary { color: white; background: linear-gradient(135deg, var(--green), var(--green-dark)); box-shadow: 0 8px 22px rgba(37,163,111,.22); }
  .button-secondary { color: var(--navy); background: #edf1f5; }
  .button-danger { color: var(--red); background: var(--red-soft); }
  .button-quiet { color: var(--navy); background: transparent; border: 1px solid var(--line); }
  .button-full { width: 100%; }
  .button-small { min-height: 40px; padding: 9px 12px; font-size: 13px; }
  .button-row { display: flex; gap: 9px; flex-wrap: wrap; }
  .button-row > * { flex: 1 1 130px; }

  .portal { width: min(100%, 760px); min-height: 100vh; margin: 0 auto; background: var(--paper); box-shadow: 0 0 80px rgba(23,36,58,.08); }
  .topbar {
    position: sticky;
    z-index: 20;
    top: 0;
    min-height: 78px;
    padding: max(14px, env(safe-area-inset-top)) 18px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(23,36,58,.96);
    color: white;
    backdrop-filter: blur(16px);
  }
  .topbar-brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .topbar-brand img { width: 45px; height: 45px; object-fit: contain; border-radius: 13px; background: white; }
  .topbar-brand div { display: grid; min-width: 0; }
  .topbar-brand span { color: #b9c5d8; font-size: 10px; font-weight: 800; letter-spacing: .17em; }
  .topbar-brand strong { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 16px; }
  .icon-button { width: 44px; height: 44px; border: 1px solid rgba(255,255,255,.16); border-radius: 14px; color: white; background: rgba(255,255,255,.08); font-size: 22px; cursor: pointer; }

  .portal-main { padding: 20px 16px calc(104px + env(safe-area-inset-bottom)); }
  .view { display: none; animation: enter .2s ease-out; }
  .view.active { display: block; }
  @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  .section-heading { margin: 4px 2px 16px; display: flex; align-items: end; justify-content: space-between; gap: 16px; }
  .count-pill, .status-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 800;
  }
  .count-pill { min-width: 34px; height: 34px; padding: 0 11px; color: var(--navy); background: white; border: 1px solid var(--line); }
  .status-pill { min-height: 28px; padding: 5px 10px; color: var(--navy-2); background: #eaf0f7; }
  .status-pill.good { color: var(--green-dark); background: var(--green-soft); }
  .status-pill.warn { color: #8c560b; background: var(--amber-soft); }
  .status-pill.bad { color: var(--red); background: var(--red-soft); }

  .hero-card {
    position: relative;
    overflow: hidden;
    padding: 22px;
    color: white;
    background: linear-gradient(145deg, var(--navy), #284264);
    border: 0;
  }
  .hero-card::after { content: ""; position: absolute; width: 170px; height: 170px; right: -70px; top: -80px; border-radius: 50%; background: rgba(37,163,111,.32); }
  .hero-card .eyebrow { color: #80d8b6; }
  .hero-card h2 { color: white; font-size: 30px; }
  .hero-card p { position: relative; z-index: 1; margin: 8px 0 0; color: #d4ddea; line-height: 1.5; }
  .hero-card .status-pill { margin-top: 15px; }
  .card { padding: 18px; margin-bottom: 14px; box-shadow: 0 7px 24px rgba(23,36,58,.07); }
  .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
  .card p { color: var(--muted); line-height: 1.5; }
  .card p:last-child { margin-bottom: 0; }
  .meta { margin: 4px 0 0; color: var(--muted); font-size: 12px; line-height: 1.45; }
  .availability-card { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 16px; }
  .availability-actions { display: flex; gap: 8px; }
  .availability-option { min-width: 62px; min-height: 43px; padding: 8px 11px; border: 1px solid var(--line); border-radius: 12px; color: var(--navy); background: white; font-weight: 800; cursor: pointer; }
  .availability-option.selected { color: white; border-color: var(--green); background: var(--green); }
  .availability-option[data-value="No"].selected { border-color: var(--navy-2); background: var(--navy-2); }

  .progress-wrap { margin-top: 15px; }
  .progress-track { height: 10px; overflow: hidden; border-radius: 999px; background: #dce5ee; }
  .progress-bar { width: 0; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--green), #62c99f); transition: width .35s ease; }
  .progress-meta { display: flex; justify-content: space-between; gap: 12px; margin-top: 7px; color: #d4ddea; font-size: 12px; }
  .checklist-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
  .check-item { min-height: 72px; padding: 12px; border-radius: 14px; background: #f5f7fa; }
  .check-item span { display: block; color: var(--muted); font-size: 11px; font-weight: 700; }
  .check-item strong { display: block; margin-top: 5px; color: var(--navy); font-size: 14px; }

  .dispatch-card { border-left: 4px solid var(--line); }
  .dispatch-card.status-assigned { border-left-color: var(--amber); }
  .dispatch-card.status-confirmed, .dispatch-card.status-en-route { border-left-color: var(--green); }
  .dispatch-card.status-cancelled { border-left-color: var(--red); opacity: .82; }
  .route { display: grid; grid-template-columns: 18px 1fr; column-gap: 10px; row-gap: 4px; margin: 14px 0; }
  .route-dot { width: 10px; height: 10px; margin-top: 5px; border-radius: 50%; background: var(--green); }
  .route-dot.dropoff { background: var(--navy-2); }
  .route-line { width: 2px; min-height: 18px; margin: -1px 0 -1px 4px; background: var(--line); }
  .route-label { color: var(--muted); font-size: 11px; font-weight: 750; }
  .route-address { color: var(--ink); font-size: 14px; font-weight: 700; }

  .event-card { padding-bottom: 16px; }
  .event-details { display: grid; gap: 5px; margin: 12px 0 15px; color: var(--muted); font-size: 13px; }
  .resource-list { display: grid; gap: 9px; margin-top: 18px; }
  .resource-link { display: flex; align-items: center; justify-content: space-between; min-height: 54px; padding: 12px 14px; color: var(--navy); text-decoration: none; background: white; border: 1px solid var(--line); border-radius: 14px; font-weight: 750; }
  .resource-link span:last-child { color: var(--green-dark); }
  .form-card { display: grid; gap: 12px; }
  .logout-button { margin-top: 22px; }
  .empty-state { padding: 35px 18px; text-align: center; background: white; border: 1px dashed #cbd5e1; border-radius: var(--radius); }
  .empty-state .empty-icon { display: block; font-size: 36px; margin-bottom: 8px; }
  .empty-state h3 { margin-bottom: 7px; }
  .empty-state p { max-width: 330px; margin: 0 auto; color: var(--muted); line-height: 1.5; }

  .bottom-nav {
    position: fixed;
    z-index: 30;
    bottom: 0;
    left: 50%;
    width: min(100%, 760px);
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    padding: 8px 10px calc(8px + env(safe-area-inset-bottom));
    border-top: 1px solid rgba(221,227,234,.9);
    background: rgba(255,255,255,.96);
    backdrop-filter: blur(18px);
  }
  .nav-item { min-height: 58px; border: 0; border-radius: 14px; color: var(--muted); background: transparent; display: grid; place-content: center; gap: 1px; cursor: pointer; }
  .nav-item span { font-size: 21px; line-height: 1; }
  .nav-item small { font-size: 10px; font-weight: 800; }
  .nav-item.active { color: var(--green-dark); background: var(--green-soft); }

  .loading-overlay { position: fixed; z-index: 100; inset: 0; display: grid; place-content: center; gap: 12px; color: white; background: rgba(23,36,58,.72); backdrop-filter: blur(5px); text-align: center; font-weight: 750; }
  .spinner { width: 36px; height: 36px; margin: 0 auto; border: 4px solid rgba(255,255,255,.25); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position: fixed; z-index: 110; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); width: min(calc(100% - 34px), 520px); transform: translateX(-50%); padding: 13px 15px; color: white; background: var(--navy); border-radius: 13px; box-shadow: var(--shadow); text-align: center; font-size: 13px; font-weight: 750; }
  .toast.error { background: var(--red); }

  @media (min-width: 680px) {
    .portal-main { padding-left: 26px; padding-right: 26px; }
    .checklist-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
  }
</style>
