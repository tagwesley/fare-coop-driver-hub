<script>
  (() => {
    'use strict';

    const SESSION_KEY = 'fareCoopDriverHubSession';
    const state = {email: '', token: localStorage.getItem(SESSION_KEY) || '', data: null, toastTimer: null};
    const $ = id => document.getElementById(id);

    const loginScreen = $('loginScreen');
    const portalScreen = $('portalScreen');
    const emailForm = $('emailForm');
    const codeForm = $('codeForm');
    const emailInput = $('emailInput');
    const codeInput = $('codeInput');

    function server(method, ...args) {
      return new Promise((resolve, reject) => {
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler(reject)[method](...args);
      });
    }

    function setLoading(active, text) {
      $('loadingText').textContent = text || 'Loading…';
      $('loadingOverlay').classList.toggle('hidden', !active);
    }

    function toast(message, isError) {
      const element = $('toast');
      clearTimeout(state.toastTimer);
      element.textContent = message || 'Something went wrong.';
      element.classList.toggle('error', Boolean(isError));
      element.classList.remove('hidden');
      state.toastTimer = setTimeout(() => element.classList.add('hidden'), 4200);
    }

    function errorMessage(error) {
      return String(error && error.message ? error.message : error || 'Something went wrong.')
        .replace(/^Exception:\s*/i, '')
        .replace(/^Error:\s*/i, '');
    }

    function handleError(error) {
      const message = errorMessage(error);
      if (message.includes('AUTH_REQUIRED')) {
        signOut(false);
        toast('Your secure session expired. Sign in again.', true);
        return;
      }
      toast(message, true);
    }

    function esc(value) {
      return String(value === null || value === undefined ? '' : value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function slug(value) {
      return String(value || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
    }

    function statusClass(value) {
      const normalized = String(value || '').toLowerCase();
      if (['yes', 'confirmed', 'en route', 'completed', 'closed', 'active', 'open'].some(item => normalized.includes(item))) return 'good';
      if (['no', 'cancelled', 'failed', 'paused'].some(item => normalized.includes(item))) return 'bad';
      return 'warn';
    }

    function percentFrom(value) {
      const text = String(value || '').trim();
      const number = parseFloat(text);
      if (!Number.isFinite(number)) return 0;
      return Math.max(0, Math.min(100, text.includes('%') ? number : number <= 1 ? number * 100 : number));
    }

    async function requestCode() {
      state.email = emailInput.value.trim().toLowerCase();
      if (!emailInput.reportValidity()) return;
      setLoading(true, 'Sending your secure code…');
      try {
        const result = await server('requestLoginCode', state.email);
        if (result && result.ok === false) throw new Error(result.message);
        emailForm.classList.add('hidden');
        codeForm.classList.remove('hidden');
        codeInput.value = '';
        codeInput.focus();
        toast(result.message);
      } catch (error) {
        handleError(error);
      } finally {
        setLoading(false);
      }
    }

    async function verifyCode() {
      if (!codeInput.reportValidity()) return;
      setLoading(true, 'Opening your Driver Hub…');
      try {
        const result = await server('verifyLoginCode', state.email, codeInput.value);
        if (!result || !result.ok) throw new Error(result && result.message ? result.message : 'Unable to sign in.');
        state.token = result.token;
        localStorage.setItem(SESSION_KEY, state.token);
        await loadPortal();
      } catch (error) {
        handleError(error);
      } finally {
        setLoading(false);
      }
    }

    async function loadPortal(showLoader = false) {
      if (!state.token) return;
      if (showLoader) setLoading(true, 'Refreshing your driver data…');
      try {
        const result = await server('getPortalData', state.token);
        if (!result || !result.ok) throw new Error('Unable to load your driver data.');
        state.data = result;
        renderPortal();
        loginScreen.classList.add('hidden');
        portalScreen.classList.remove('hidden');
      } catch (error) {
        handleError(error);
      } finally {
        if (showLoader) setLoading(false);
      }
    }

    function renderPortal() {
      const data = state.data;
      $('driverGreeting').textContent = `Hi, ${(data.driver.name || 'Driver').split(/\s+/)[0]}`;
      renderHome();
      renderDispatches();
      renderEvents();
      renderResources();
    }

    function renderHome() {
      const {driver, availability, operationalStatus, dispatches} = state.data;
      const stagePercent = percentFrom(driver.stageProgress);
      const openDispatches = dispatches.filter(item => !['Completed', 'Cancelled'].includes(item.status)).length;
      const checklist = [
        ['Background + quiz', driver.background || 'Unknown'],
        ['Documents', driver.documents || 'Unknown'],
        ['Vehicle', driver.vehicle || 'Unknown'],
        ['Stripe', driver.stripe || 'Unknown']
      ];

      $('homeContent').innerHTML = `
        <article class="card hero-card">
          <p class="eyebrow">ONBOARDING STATUS</p>
          <h2>${esc(driver.stage || 'Driver record connected')}</h2>
          <p>${esc(driver.nextRequiredStep)}</p>
          <span class="status-pill ${statusClass(driver.stage)}">${esc(driver.stageProgress || 'Status connected')}</span>
          <div class="progress-wrap">
            <div class="progress-track"><div class="progress-bar" style="width:${stagePercent}%"></div></div>
            <div class="progress-meta"><span>Onboarding progress</span><strong>${Math.round(stagePercent)}%</strong></div>
          </div>
        </article>

        <article class="card availability-card">
          <div>
            <p class="eyebrow">DISPATCH STATUS</p>
            <h3>Available to drive?</h3>
            <p class="meta">Current status: ${esc(operationalStatus || 'Waiting')} · ${openDispatches} open assignment${openDispatches === 1 ? '' : 's'}</p>
          </div>
          <div class="availability-actions" role="group" aria-label="Availability">
            <button class="availability-option ${availability === 'Yes' ? 'selected' : ''}" data-availability="Yes" type="button">Yes</button>
            <button class="availability-option ${availability === 'No' ? 'selected' : ''}" data-availability="No" type="button">No</button>
          </div>
        </article>

        <article class="card">
          <div class="card-header"><div><p class="eyebrow">DRIVER CHECKLIST</p><h3>Your setup</h3></div><span class="status-pill ${statusClass(driver.checklistProgress)}">${esc(driver.checklistProgress || '0%')}</span></div>
          <div class="checklist-grid">
            ${checklist.map(item => `<div class="check-item"><span>${esc(item[0])}</span><strong>${esc(item[1])}</strong></div>`).join('')}
          </div>
        </article>

        <article class="card">
          <div class="card-header"><div><p class="eyebrow">YOUR RECORD</p><h3>${esc(driver.name)}</h3></div><span class="status-pill">ID ${esc(driver.id)}</span></div>
          <p class="meta">${esc(driver.city || 'Market not set')} · ${esc(driver.email)}</p>
          <p class="meta">Referral owner: ${esc(driver.referralOwner || 'Fare Co-op')} · Source: ${esc(driver.source || 'Driver roster')}</p>
        </article>`;

      document.querySelectorAll('[data-availability]').forEach(button => {
        button.addEventListener('click', () => updateAvailability(button.dataset.availability));
      });
    }

    function renderDispatches() {
      const dispatches = state.data.dispatches || [];
      $('dispatchCount').textContent = dispatches.filter(item => !['Completed', 'Cancelled'].includes(item.status)).length;
      if (!dispatches.length) {
        $('dispatchContent').innerHTML = emptyState('✓', 'No assignments yet', 'When Fare Co-op operations assigns a ride or event, it will appear here.');
        return;
      }
      $('dispatchContent').innerHTML = dispatches.map(item => {
        const buttons = dispatchButtons(item);
        return `<article class="card dispatch-card status-${slug(item.status)}">
          <div class="card-header">
            <div><p class="eyebrow">${esc(item.pickupTime || 'TIME TO BE SET')}</p><h3>${esc(item.riderClient || item.rideEventId || 'Fare Co-op assignment')}</h3></div>
            <span class="status-pill ${statusClass(item.status)}">${esc(item.status)}</span>
          </div>
          <div class="route">
            <span class="route-dot"></span><div><div class="route-label">PICKUP</div><div class="route-address">${esc(item.pickup || 'Pickup to be provided')}</div></div>
            <span class="route-line"></span><span></span>
            <span class="route-dot dropoff"></span><div><div class="route-label">DROPOFF</div><div class="route-address">${esc(item.dropoff || 'Dropoff to be provided')}</div></div>
          </div>
          ${item.notes ? `<p class="meta">${esc(item.notes)}</p>` : ''}
          ${buttons ? `<div class="button-row">${buttons}</div>` : ''}
        </article>`;
      }).join('');

      document.querySelectorAll('[data-dispatch-id]').forEach(button => {
        button.addEventListener('click', () => changeDispatch(button.dataset.dispatchId, button.dataset.status));
      });
    }

    function dispatchButtons(item) {
      if (item.status === 'Assigned') {
        return `<button class="button button-primary button-small" data-dispatch-id="${esc(item.id)}" data-status="Confirmed" type="button">Accept assignment</button><button class="button button-danger button-small" data-dispatch-id="${esc(item.id)}" data-status="Cancelled" type="button">Can't take it</button>`;
      }
      if (item.status === 'Confirmed') {
        return `<button class="button button-primary button-small" data-dispatch-id="${esc(item.id)}" data-status="En Route" type="button">I'm en route</button><button class="button button-danger button-small" data-dispatch-id="${esc(item.id)}" data-status="Cancelled" type="button">Cancel</button>`;
      }
      if (item.status === 'En Route') {
        return `<button class="button button-primary button-small" data-dispatch-id="${esc(item.id)}" data-status="Completed" type="button">Mark complete</button>`;
      }
      return '';
    }

    function renderEvents() {
      const events = state.data.events || [];
      if (!events.length) {
        $('eventsContent').innerHTML = emptyState('★', 'No events in your market yet', 'New event-driving opportunities will appear here when they are added by operations.');
        return;
      }
      $('eventsContent').innerHTML = events.map(event => `<article class="card event-card">
        <div class="card-header"><div><p class="eyebrow">${esc(event.start || 'DATE TO BE SET')}</p><h3>${esc(event.name)}</h3></div><span class="status-pill ${statusClass(event.status)}">${esc(event.status || 'Upcoming')}</span></div>
        <div class="event-details">
          <span>⌖ ${esc(event.venue || event.address || event.market || 'Location to be provided')}</span>
          ${event.driversNeeded ? `<span>Drivers needed: ${esc(event.driversNeeded)}</span>` : ''}
          ${event.notes ? `<span>${esc(event.notes)}</span>` : ''}
        </div>
        <div class="button-row">
          <button class="button button-primary button-small" data-event-id="${esc(event.id)}" type="button">I'm interested</button>
          ${event.ticketingUrl ? `<a class="button button-secondary button-small" href="${esc(event.ticketingUrl)}" target="_blank" rel="noopener">Event details</a>` : ''}
        </div>
      </article>`).join('');
      document.querySelectorAll('[data-event-id]').forEach(button => {
        button.addEventListener('click', () => submitEventInterest(button.dataset.eventId, button));
      });
    }

    function renderResources() {
      const links = state.data.links || {};
      const items = [
        ['Fare Co-op driver portal', links.fareDriverPortal],
        ['Membership and requirements', links.membership],
        ['Driver tutorials', links.tutorials],
        ['Fare Co-op support', links.support]
      ];
      $('resourceLinks').innerHTML = items.filter(item => item[1]).map(item => `<a class="resource-link" href="${esc(item[1])}" target="_blank" rel="noopener"><span>${esc(item[0])}</span><span>↗</span></a>`).join('');
    }

    function emptyState(icon, title, body) {
      return `<div class="empty-state"><span class="empty-icon">${esc(icon)}</span><h3>${esc(title)}</h3><p>${esc(body)}</p></div>`;
    }

    async function updateAvailability(value) {
      setLoading(true, 'Updating availability…');
      try {
        const result = await server('setAvailability', state.token, value);
        if (!result || !result.ok) throw new Error(result && result.message ? result.message : 'Unable to update availability.');
        state.data.availability = result.availability;
        state.data.operationalStatus = result.operationalStatus;
        renderHome();
        toast(result.message);
      } catch (error) {
        handleError(error);
      } finally {
        setLoading(false);
      }
    }

    async function changeDispatch(dispatchId, status) {
      setLoading(true, 'Updating assignment…');
      try {
        const result = await server('updateDispatchStatus', state.token, dispatchId, status);
        if (!result || !result.ok) throw new Error(result && result.message ? result.message : 'Unable to update assignment.');
        toast(result.message);
        await loadPortal(false);
      } catch (error) {
        handleError(error);
      } finally {
        setLoading(false);
      }
    }

    async function submitEventInterest(eventId, button) {
      button.disabled = true;
      try {
        const result = await server('expressEventInterest', state.token, eventId);
        if (!result || !result.ok) throw new Error(result && result.message ? result.message : 'Unable to send interest.');
        button.textContent = 'Interest sent';
        toast(result.message);
      } catch (error) {
        button.disabled = false;
        handleError(error);
      }
    }

    async function submitHelp(event) {
      event.preventDefault();
      const category = $('helpCategory').value;
      const details = $('helpDetails').value.trim();
      if (!event.currentTarget.reportValidity()) return;
      setLoading(true, 'Sending your request…');
      try {
        const result = await server('submitHelpRequest', state.token, category, details);
        if (!result || !result.ok) throw new Error(result && result.message ? result.message : 'Unable to send your request.');
        event.currentTarget.reset();
        toast(result.message);
      } catch (error) {
        handleError(error);
      } finally {
        setLoading(false);
      }
    }

    async function signOut(callServer = true) {
      const token = state.token;
      state.token = '';
      state.data = null;
      localStorage.removeItem(SESSION_KEY);
      portalScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      emailForm.classList.remove('hidden');
      codeForm.classList.add('hidden');
      codeInput.value = '';
      if (callServer && token) {
        try { await server('logoutDriver', token); } catch (_) {}
      }
    }

    function switchView(target) {
      document.querySelectorAll('.view').forEach(view => view.classList.toggle('active', view.dataset.view === target));
      document.querySelectorAll('.nav-item').forEach(item => item.classList.toggle('active', item.dataset.target === target));
      window.scrollTo({top: 0, behavior: 'smooth'});
    }

    emailForm.addEventListener('submit', event => { event.preventDefault(); requestCode(); });
    codeForm.addEventListener('submit', event => { event.preventDefault(); verifyCode(); });
    $('backToEmail').addEventListener('click', () => { codeForm.classList.add('hidden'); emailForm.classList.remove('hidden'); emailInput.focus(); });
    $('resendCode').addEventListener('click', requestCode);
    $('refreshButton').addEventListener('click', () => loadPortal(true));
    $('helpForm').addEventListener('submit', submitHelp);
    $('logoutButton').addEventListener('click', () => signOut(true));
    document.querySelectorAll('.nav-item').forEach(item => item.addEventListener('click', () => switchView(item.dataset.target)));
    codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6); });

    if (state.token) loadPortal(true);
  })();
</script>
